# SignBridge AI — Render deployment Blueprint
# https://render.com/docs/blueprint-spec
# Validate locally: render blueprints validate render.yaml

services:
  # Standalone web dashboard and webcam studio (Static Site)
  - type: web
    name: signbridge-web
    runtime: static
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run assets:setup && npm run build:web
    staticPublishPath: ./extension/dist-web
    routes:
      - type: rewrite
        source: /webcam
        destination: /webcam.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /vendor/mediapipe/wasm/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /models/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 20.20.0
      - key: VITE_BACKEND_URL
        value: https://signbridge-api.onrender.com

  # FastAPI inference backend (Web Service)
  - type: web
    name: signbridge-api
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r backend/requirements-lock.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SIGNBRIDGE_HOST
        value: 0.0.0.0
      - key: SIGNBRIDGE_ALLOWED_ORIGINS
        value: https://signbridge-web.onrender.com,https://signbridge-2mpr.onrender.com
      - key: SIGNBRIDGE_TRUSTED_HOSTS
        value: signbridge-api.onrender.com
      - key: PUBLIC_APP_ORIGIN
        value: https://signbridge-web.onrender.com
      # Set SIGNBRIDGE_MODEL_DIR only after a validated model artifact
      # is provisioned into the deployed service's filesystem.
