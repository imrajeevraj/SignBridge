# SignBridge AI — Render Deployment Blueprint
# Specification: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Service 1: Static Web Frontend (Production Dashboard & Studio)
  # ---------------------------------------------------------------------------
  - type: static
    name: signbridge-web
    plan: free
    buildCommand: npm ci && npm run assets:setup && npm run build:web
    staticPublishPath: ./extension/dist-web
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /webcam
        destination: /webcam.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /vendor/mediapipe/wasm/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /models/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_BACKEND_URL
        value: https://signbridge-api.onrender.com

  # ---------------------------------------------------------------------------
  # Service 2: FastAPI ML Inference Backend
  # ---------------------------------------------------------------------------
  - type: web
    name: signbridge-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SIGNBRIDGE_HOST
        value: 0.0.0.0
      - key: SIGNBRIDGE_ALLOWED_ORIGINS
        value: https://signbridge-web.onrender.com,https://signbridge-2mpr.onrender.com
      - key: SIGNBRIDGE_TRUSTED_HOSTS
        value: signbridge-api.onrender.com,*.onrender.com
      - key: PUBLIC_APP_ORIGIN
        value: https://signbridge-web.onrender.com
      - key: SIGNBRIDGE_MODEL_DIR
        value: ml/runs/isl500-v2-remediated

